<!DOCTYPE html>
<html>
<head>
  <title>My PDF Library</title>

  <style>
    body{
      font-family: Arial;
      background:#f5f5f5;
      padding:20px;
    }

    h1{
      text-align:center;
    }

    .upload-box{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
    }

    .pdf-list{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    button{
      padding:10px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }
  </style>
</head>
<body>

<h1>PDF Upload & Viewer</h1>

<div class="upload-box">
  <input type="file" id="pdfUpload" accept="application/pdf">
</div>

<div class="pdf-list" id="pdfList"></div>

<script src="script.js"></script>

</body>
</html>
